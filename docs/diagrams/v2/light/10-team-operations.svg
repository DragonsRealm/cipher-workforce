<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" role="img" aria-labelledby="title desc" data-theme="light" data-geometry-signature="9002f02d01716d7e">
<title id="title">Team Operations — light theme</title>
<desc id="desc">A team lead uses its intrinsic Task Manager to persist bounded work for graph-connected teammates. AgentTeamService enforces workflow, lead, execution, assignee, and optimistic-revision boundaries while tasks advance from blocked or queued through worker submission and explicit lead acceptance; Task Manager and Team Monitor expose mutable and read-only views of the same durable state. Sources: server/nodes/tool/task_manager/__init__.py; server/services/agent_team.py; server/services/agent_teams/handlers.py; server/services/temporal/agent_workflow.py; client/src/components/parameterPanel/TaskManagerPanel.tsx; client/src/components/parameterPanel/TeamMonitorPanel.tsx</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  <style>
    .title { fill:#1a1d21; font:700 30px Geist,system-ui,sans-serif; }
    .subtitle { fill:#4b5563; font:400 18px Geist,system-ui,sans-serif; }
    .group-label { fill:#4b5563; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:1.2px; }
    .type-label { fill:#4b5563; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.8px; }
    .node-label { fill:#1a1d21; font:650 20px Geist,system-ui,sans-serif; }
    .node-detail { fill:#4b5563; font:400 16px Geist,system-ui,sans-serif; }
    .edge-label { fill:#1a1d21; font:500 16px Geist,system-ui,sans-serif; }
    .edge-protocol { fill:#4b5563; font:500 16px 'JetBrains Mono',ui-monospace,monospace; }
    .callout-title { fill:#1a1d21; font:650 18px Geist,system-ui,sans-serif; }
    .callout-text { fill:#4b5563; font:400 16px Geist,system-ui,sans-serif; }
    .legend { fill:#4b5563; font:500 16px Geist,system-ui,sans-serif; }
  </style>
</defs>
<rect width="1920" height="1080" fill="#f5f7fa"/>
<text x="72" y="58" class="title">Team Operations</text>
<text x="72" y="91" class="subtitle">Execution-scoped durable tasks: assign, run, review, recover, and finish</text>
