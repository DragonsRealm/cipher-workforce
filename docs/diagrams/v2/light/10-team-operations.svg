ationship-id="service-updates-human"><title>snapshots + lifecycle events</title><path d="M 1100.0 345 L 1100 365 L 1570 365 L 1570.0 345" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow)"/><path d="M 1335.0 365.0 L 1335 419" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/><rect x="1216.6" y="404.0" width="236.79999999999998" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1335" y="422" class="edge-label" text-anchor="middle" textLength="218.8" lengthAdjust="spacingAndGlyphs">snapshots + lifecycle events</text></g><g data-relationship-id="service-assigns-ready"><title>assign_task persists ready work</title><path d="M 1100.0 345 L 1100 395 L 565 395 L 565.0 520" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="700.2" y="380.0" width="259.6" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="830" y="398" class="edge-label" text-anchor="middle" textLength="241.6" lengthAdjust="spacingAndGlyphs">assign_task persists ready work</text></g><g data-relationship-id="dependencies-unblock"><title>dependencies accepted</title><path d="M 360 590.0 L 440 590.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="308.2" y="480.0" width="183.6" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="400" y="498" class="edge-label" text-anchor="middle" textLength="165.6" lengthAdjust="spacingAndGlyphs">dependencies accepted</text></g><g data-relationship-id="worker-claims"><title>worker claims task</title><path d="M 690 590.0 L 770 590.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="649.6" y="480.0" width="160.79999999999998" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="730" y="498" class="edge-label" text-anchor="middle" textLength="142.8" lengthAdjust="spacingAndGlyphs">worker claims task</text></g><g data-relationship-id="worker-submits"><title>worker succeeds</title><path d="M 1020 590.0 L 1100 590.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="991.0" y="480.0" width="138.0" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1060" y="498" class="edge-label" text-anchor="middle" textLength="120.0" lengthAdjust="spacingAndGlyphs">worker succeeds</text></g><g data-relationship-id="lead-accepts"><title>accept_task</title><path d="M 1350 590.0 L 1430 590.0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="1330.0" y="480.0" width="120" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1390" y="498" class="edge-label" text-anchor="middle">accept_task</text></g><g data-relationship-id="worker-fails"><title>worker errors</title><path d="M 895.0 660 L 895.0 760" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="833.6" y="695.0" width="122.8" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="895" y="713" class="edge-label" text-anchor="middle" textLength="104.8" lengthAdjust="spacingAndGlyphs">worker errors</text></g><g data-relationship-id="failed-requeues"><title>retry_task / reassign_task</title><path d="M 770 830.0 L 720 700 L 565 700 L 565.0 660" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="529.2" y="685.0" width="221.6" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="640" y="703" class="edge-label" text-anchor="middle" textLength="203.6" lengthAdjust="spacingAndGlyphs">retry_task / reassign_task</text></g><g data-relationship-id="submitted-requeues"><title>retry_task / reassign_task</title><path d="M 1225.0 520 L 1225 455 L 565 455 L 565.0 520" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow)"/><rect x="784.2" y="440.0" width="221.6" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="895" y="458" class="edge-label" text-anchor="middle" textLength="203.6" lengthAdjust="spacingAndGlyphs">retry_task / reassign_task</text></g><g data-relationship-id="cancelled-requeues"><title>retry_task / reassign_task</title><path d="M 1225.0 900 L 1225 925 L 700 925 L 700 700 L 565.0 660" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow)"/><rect x="784.2" y="910.0" width="221.6" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="895" y="928" class="edge-label" text-anchor="middle" textLength="203.6" lengthAdjust="spacingAndGlyphs">retry_task / reassign_task</text></g><g data-relationship-id="accepted-finishes-team"><title>finish_team when all resolved</title><path d="M 1555.0 660 L 1555.0 760" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="1432.8" y="675.0" width="244.39999999999998" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1555" y="693" class="edge-label" text-anchor="middle" textLength="226.4" lengthAdjust="spacingAndGlyphs">finish_team when all resolved</text></g><g data-relationship-id="cancelled-is-resolved"><title>cancelled also counts resolved</title><path d="M 1350 830.0 L 1430 830.0" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow)"/><rect x="1264.0" y="720.0" width="252.0" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1390" y="738" class="edge-label" text-anchor="middle" textLength="234.0" lengthAdjust="spacingAndGlyphs">cancelled also counts resolved</text></g><g data-component-id="team-lead"><title>Team Lead</title><rect x="110" y="205" width="300" height="140" rx="12" fill="#ffffff" stroke="#bd93f9" stroke-width="2"/><rect x="110" y="205" width="300" height="7" rx="4" fill="#bd93f9"/><text x="128" y="231" class="type-label">AGENT</text><text x="128" y="257" class="node-label">Team Lead</text><text x="128" y="283" class="node-detail">Orchestrator or AI Employee</text><text x="128" y="303" class="node-detail" textLength="264.0" lengthAdjust="spacingAndGlyphs">connected teammates are authority</text></g><g data-component-id="task-manager"><title>Task Manager</title><rect x="500" y="205" width="330" height="140" rx="12" fill="#ffffff" stroke="#50fa7b" stroke-width="2"/><rect x="500" y="205" width="330" height="7" rx="4" fill="#50fa7b"/><text x="518" y="231" class="type-label">INTRINSIC TOOL</text><text x="518" y="257" class="node-label">Task Manager</text><text x="518" y="283" class="node-detail">assign · inspect · review</text><text x="518" y="303" class="node-detail">retry · reassign · cancel · finish</text></g><g data-component-id="agent-team-service"><title>AgentTeamService</title><rect x="920" y="205" width="360" height="140" rx="12" fill="#ffffff" stroke="#ffb86c" stroke-width="2"/><rect x="920" y="205" width="360" height="7" rx="4" fill="#ffb86c"/><text x="938" y="231" class="type-label">DURABLE SERVICE</text><text x="938" y="257" class="node-label">AgentTeamService</text><text x="938" y="283" class="node-detail">workflow + lead + execution scope</text><text x="938" y="303" class="node-detail">optimistic revision transitions</text></g><g data-component-id="human-views"><title>Task Manager + Team Monitor</title><rect x="1390" y="205" width="360" height="140" rx="12" fill="#ffffff" stroke="#8be9fd" stroke-width="2"/><rect x="1390" y="205" width="360" height="7" rx="4" fill="#8be9fd"/><text x="1408" y="231" class="type-label">HUMAN UI</text><text x="1408" y="257" class="node-label">Task Manager +</text><text x="1408" y="279" class="node-label">Team Monitor</text><text x="1408" y="305" class="node-detail">authorized mutations + trace</text><text x="1408" y="325" class="node-detail">read-only lifecycle snapshot</text></g><g data-component-id="blocked"><title>Blocked</title><rect x="110" y="520" width="250" height="140" rx="12" fill="#ffffff" stroke="#9aa1ac" stroke-width="2"/><rect x="110" y="520" width="250" height="7" rx="4" fill="#9aa1ac"/><text x="128" y="546" class="type-label">TASK STATE</text><text x="128" y="572" class="node-label">Blocked</text><text x="128" y="598" class="node-detail">dependencies unresolved</text></g><g data-component-id="queued"><title>Queued</title><rect x="440" y="520" width="250" height="140" rx="12" fill="#ffffff" stroke="#ffb86c" stroke-width="2"/><rect x="440" y="520" width="250" height="7" rx="4" fill="#ffb86c"/><text x="458" y="546" class="type-label">TASK STATE</text><text x="458" y="572" class="node-label">Queued</text><text x="458" y="598" class="node-detail">durably persisted</text><text x="458" y="618" class="node-detail">awaiting admission</text></g><g data-component-id="running"><title>Running</title><rect x="770" y="520" width="250" height="140" rx="12" fill="#ffffff" stroke="#ffb86c" stroke-width="2"/><rect x="770" y="520" width="250" height="7" rx="4" fill="#ffb86c"/><text x="788" y="546" class="type-label">TASK STATE</text><text x="788" y="572" class="node-label">Running</text><text x="788" y="598" class="node-detail">worker claimed task</text><text x="788" y="618" class="node-detail">detached child execution</text></g><g data-component-id="submitted"><title>Submitted</title><rect x="1100" y="520" width="250" height="140" rx="12" fill="#ffffff" stroke="#ff79c6" stroke-width="2"/><rect x="1100" y="520" width="250" height="7" rx="4" fill="#ff79c6"/><text x="1118" y="546" class="type-label">TASK STATE</text><text x="1118" y="572" class="node-label">Submitted</text><text x="1118" y="598" class="node-detail" textLength="214.0" lengthAdjust="spacingAndGlyphs">worker result awaits review</text></g><g data-component-id="accepted"><title>Accepted</title><rect x="1430" y="520" width="250" height="140" rx="12" fill="#ffffff" stroke="#50fa7b" stroke-width="2"/><rect x="1430" y="520" width="250" height="7" rx="4" fill="#50fa7b"/><text x="1448" y="546" class="type-label">TASK STATE</text><text x="1448" y="572" class="node-label">Accepted</text><text x="1448" y="598" class="node-detail">lead-approved Done state</text></g><g data-component-id="failed"><title>Failed</title><rect x="770" y="760" width="250" height="140" rx="12" fill="#ffffff" stroke="#ff79c6" stroke-width="2"/><rect x="770" y="760" width="250" height="7" rx="4" fill="#ff79c6"/><text x="788" y="786" class="type-label">TASK STATE</text><text x="788" y="812" class="node-label">Failed</text><text x="788" y="838" class="node-detail" textLength="214.0" lengthAdjust="spacingAndGlyphs">error retained for recovery</text></g><g data-component-id="cancelled"><title>Cancelled</title><rect x="1100" y="760" width="250" height="140" rx="12" fill="#ffffff" stroke="#9aa1ac" stroke-width="2"/><rect x="1100" y="760" width="250" height="7" rx="4" fill="#9aa1ac"/><text x="1118" y="786" class="type-label">TASK STATE</text><text x="1118" y="812" class="node-label">Cancelled</text><text x="1118" y="838" class="node-detail" textLength="214.0" lengthAdjust="spacingAndGlyphs">intentional terminal state</text></g><g data-component-id="team-completed"><title>Team Completed</title><rect x="1430" y="760" width="250" height="140" rx="12" fill="#ffffff" stroke="#50fa7b" stroke-width="2"/><rect x="1430" y="760" width="250" height="7" rx="4" fill="#50fa7b"/><text x="1448" y="786" class="type-label">EXECUTION STATE</text><text x="1448" y="812" class="node-label">Team Completed</text><text x="1448" y="838" class="node-detail" textLength="214.0" lengthAdjust="spacingAndGlyphs">all tasks accepted or cancelled</text></g><g data-callout-id="permitted-mutations"><rect x="110" y="740" width="550" height="165" rx="10" fill="#ffffff" stroke="#f1fa8c" stroke-width="2" stroke-dasharray="7 6"/><text x="126" y="770" class="callout-title">State-aware controls</text><text x="126" y="796" class="callout-text">modify_task: blocked or queued</text><text x="126" y="818" class="callout-text">cancel_task: blocked, queued, or running</text><text x="126" y="840" class="callout-text">list/get/inspect never mutate task state</text></g>
