"url(#arrow)"/><rect x="1418.8" y="425.0" width="282.4" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1560" y="443" class="edge-label" text-anchor="middle" textLength="264.4" lengthAdjust="spacingAndGlyphs">catalogue version + mutation event</text></g><g data-relationship-id="auth-canonical-crud"><title>canonical encrypted CRUD</title><path d="M 1215.0 690 L 1415.0 760" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="1156.8" y="700.0" width="206.39999999999998" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1260" y="718" class="edge-label" text-anchor="middle" textLength="188.4" lengthAdjust="spacingAndGlyphs">canonical encrypted CRUD</text></g><g data-relationship-id="db-uses-encryption"><title>encrypt / decrypt payloads · via Fernet</title><path d="M 1415.0 760 L 1415 720 L 1645 720 L 1645.0 690" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1580.0 720.0 L 1580 966.0" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/><rect x="1469.2" y="942.0" width="221.6" height="48" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1580" y="963.0" class="edge-label" text-anchor="middle" textLength="203.6" lengthAdjust="spacingAndGlyphs">encrypt / decrypt payloads</text><text x="1580" y="983.0" class="edge-protocol" text-anchor="middle">via Fernet</text></g><g data-relationship-id="broadcast-invalidates-client"><title>push status + invalidate catalogue · via WebSocket</title><path d="M 1650.0 230 L 1650 115 L 550 115 L 550.0 230" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#arrow)"/><path d="M 1100.0 115.0 L 1190 148.0" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/><rect x="1048.8" y="124.0" width="282.4" height="48" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1190" y="145.0" class="edge-label" text-anchor="middle" textLength="264.4" lengthAdjust="spacingAndGlyphs">push status + invalidate catalogue</text><text x="1190" y="165.0" class="edge-protocol" text-anchor="middle">via WebSocket</text></g><g data-component-id="credentials-modal"><title>Credentials Modal</title><rect x="110" y="230" width="270" height="170" rx="12" fill="#ffffff" stroke="#8be9fd" stroke-width="2"/><rect x="110" y="230" width="270" height="7" rx="4" fill="#8be9fd"/><text x="128" y="256" class="type-label">UI</text><text x="128" y="282" class="node-label">Credentials Modal</text><text x="128" y="308" class="node-detail" textLength="234.0" lengthAdjust="spacingAndGlyphs">server catalogue + IDB warm-start</text><text x="128" y="328" class="node-detail" textLength="234.0" lengthAdjust="spacingAndGlyphs">search palette + lazy panels</text></g><g data-component-id="client-state"><title>WebSocket + Query State</title><rect x="420" y="230" width="260" height="170" rx="12" fill="#ffffff" stroke="#8be9fd" stroke-width="2"/><rect x="420" y="230" width="260" height="7" rx="4" fill="#8be9fd"/><text x="438" y="256" class="type-label">CLIENT</text><text x="438" y="282" class="node-label">WebSocket +</text><text x="438" y="304" class="node-label">Query State</text><text x="438" y="330" class="node-detail">request / response RPC</text><text x="438" y="350" class="node-detail">catalogue invalidation</text></g><g data-component-id="ws-handlers"><title>Credential WS Handlers</title><rect x="800" y="230" width="270" height="170" rx="12" fill="#ffffff" stroke="#ffb86c" stroke-width="2"/><rect x="800" y="230" width="270" height="7" rx="4" fill="#ffb86c"/><text x="818" y="256" class="type-label">ROUTER</text><text x="818" y="282" class="node-label">Credential WS</text><text x="818" y="304" class="node-label">Handlers</text><text x="818" y="330" class="node-detail" textLength="234.0" lengthAdjust="spacingAndGlyphs">validate · get · save · delete</text><text x="818" y="350" class="node-detail" textLength="234.0" lengthAdjust="spacingAndGlyphs">idempotent mutation envelope</text></g>