<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" role="img" aria-labelledby="title desc" data-theme="light" data-geometry-signature="516cf648ab56c9c9">
<title id="title">Credentials Architecture — light theme</title>
<desc id="desc">Credential configuration flows from the server-owned provider catalogue through modular client panels and registered WebSocket handlers. AuthService is the only plaintext access boundary; CredentialsDatabase encrypts separate API-key and OAuth-token records with the process-held Fernet service, while status events invalidate every connected client&#x27;s catalogue. Sources: client/src/components/credentials/CredentialsModal.tsx; client/src/components/credentials/useCredentialPanel.ts; server/services/credentials/handlers.py; server/services/plugin/credential.py; server/services/auth.py; server/core/credentials_database.py; server/core/encryption.py; server/services/status_broadcaster.py</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  <style>
    .title { fill:#1a1d21; font:700 30px Geist,system-ui,sans-serif; }
    .subtitle { fill:#4b5563; font:400 18px Geist,system-ui,sans-serif; }
    .group-label { fill:#4b5563; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:1.2px; }
    .type-label { fill:#4b5563; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.8px; }
    .node-label { fill:#1a1d21; font:650 20px Geist,system-ui,sans-serif; }
    .node-detail { fill:#4b5563; font:400 16px Geist,system-ui,sans-serif; }
    .edge-label { fill:#1a1d21; font:500 16px Geist,system-ui,sans-serif; }
    .edge-protocol { fill:#4b5563; font:500 16px 'JetBrains Mono',ui-monospace,monospace; }
    .callout-title { fill:#1a1d21; font:650 18px Geist,system-ui,sans-serif; }
    .callout-text { fill:#4b5563; font:400 16px Geist,system-ui,sans-serif; }
    .legend { fill:#4b5563; font:500 16px Geist,system-ui,sans-serif; }
  </style>
</defs>
