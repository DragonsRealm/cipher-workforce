<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" role="img" aria-labelledby="title desc" data-theme="light" data-geometry-signature="37076efb9c516523">
<title id="title">Master Skill Editor — light theme</title>
<desc id="desc">Source-backed anatomy of the Master Skill editor: built-in and user skill sources flow through WebSocket handlers and TanStack caches into the catalogue and instruction editor, while enabled skills persist in skills_config, expand for a connected agent, and report safe runtime badges back to the exact Master Skill row. Sources: client/src/components/parameterPanel/MasterSkillEditor.tsx; client/src/hooks/useFolderSkills.ts; server/services/skills/handlers.py; server/nodes/skill/master_skill/__init__.py; server/nodes/skill/_expander.py; server/services/skill_runtime.py; server/nodes/skill/master_skill/_events.py; client/src/contexts/WebSocketContext.tsx</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  <style>
    .title { fill:#1a1d21; font:700 30px Geist,system-ui,sans-serif; }
    .subtitle { fill:#4b5563; font:400 18px Geist,system-ui,sans-serif; }
    .group-label { fill:#4b5563; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:1.2px; }
    .type-label { fill:#4b5563; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.8px; }
    .node-label { fill:#1a1d21; font:650 20px Geist,system-ui,sans-serif; }
    .node-detail { fill:#4b5563; font:400 16px Geist,system-ui,sans-serif; }
    .edge-label { fill:#1a1d21; font:500 16px Geist,system-ui,sans-serif; }
    .edge-protocol { fill:#4b5563; font:500 16px 'JetBrains Mono',ui-monospace,monospace; }
    .callout-title { fill:#1a1d21; font:650 18px Geist,system-ui,sans-serif; }
    .callout-text { fill:#4b5563; font:400 16px Geist,system-ui,sans-serif; }
    .legend { fill:#4b5563; font:500 16px Geist,system-ui,sans-serif; }
  </style>
</defs>
<rect width="1920" height="1080" fill="#f5f7fa"/>
<text x="72" y="58" class="title">Master Skill Editor</text>
<text x="72" y="91" class="subtitle">One split panel joins the skill catalogue, authoritative instructions, node configuration, and live retrieval state.</text>
