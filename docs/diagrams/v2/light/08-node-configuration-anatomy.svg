<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" role="img" aria-labelledby="title desc" data-theme="light" data-geometry-signature="35179531c67b57ed">
<title id="title">Node Configuration Anatomy — light theme</title>
<desc id="desc">An anatomy of the Node Configuration modal showing the real header actions, the 0.7 / 1.6 / 0.7 Input–Parameters–Output layout, NodeSpec-driven variants, local edit-buffer persistence, save-before-run execution, and WebSocket-correlated output handling. Sources: client/src/ParameterPanel.tsx; client/src/components/parameterPanel/ParameterPanelLayout.tsx; client/src/components/parameterPanel/InputSection.tsx; client/src/components/parameterPanel/MiddleSection.tsx; client/src/components/parameterPanel/OutputSection.tsx; client/src/hooks/useParameterPanel.ts; client/src/hooks/useNodeParamsQuery.ts; client/src/services/executionService.ts; server/routers/websocket.py; server/core/database.py</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  <style>
    .title { fill:#1a1d21; font:700 30px Geist,system-ui,sans-serif; }
    .subtitle { fill:#4b5563; font:400 18px Geist,system-ui,sans-serif; }
    .group-label { fill:#4b5563; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:1.2px; }
    .type-label { fill:#4b5563; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.8px; }
    .node-label { fill:#1a1d21; font:650 20px Geist,system-ui,sans-serif; }
    .node-detail { fill:#4b5563; font:400 16px Geist,system-ui,sans-serif; }
    .edge-label { fill:#1a1d21; font:500 16px Geist,system-ui,sans-serif; }
    .edge-protocol { fill:#4b5563; font:500 16px 'JetBrains Mono',ui-monospace,monospace; }
    .callout-title { fill:#1a1d21; font:650 18px Geist,system-ui,sans-serif; }
    .callout-text { fill:#4b5563; font:400 16px Geist,system-ui,sans-serif; }
    .legend { fill:#4b5563; font:500 16px Geist,system-ui,sans-serif; }
  </style>
</defs>
<rect width="1920" height="1080" fill="#f5f7fa"/>
<text x="72" y="58" class="title">Node Configuration Anatomy</text>
<text x="72" y="91" class="subtitle">A schema-driven modal combines draggable upstream data, a local parameter draft, per-node execution, and correlated live output</text>
<g data-group-id="configuration-modal"><rect x="50" y="125" width="1820" height="620" rx="18" fill="#fafbfc" stroke="#8be9fd" stroke-width="2"/><text x="70" y="157" class="group-label">NODE CONFIGURATION MODAL</text></g><g data-group-id="panel-data-plane"><rect x="50" y="775" width="1820" height="180" rx="18" fill="#fafbfc" stroke="#ffb86c" stroke-width="2"/><text x="70" y="807" class="group-label">LIVE DATA &amp; PERSISTENCE</text></g><g data-relationship-id="r-spec-identity"><title>supplies icon and display name</title><path d="M 255.0 820 L 255 760 L 370 760 L 370.0 285" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="244.0" y="745.0" width="252.0" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="370" y="763" class="edge-label" text-anchor="middle" textLength="234.0" lengthAdjust="spacingAndGlyphs">supplies icon and display name</text></g><g data-relationship-id="r-spec-parameters"><title>renders fields and panel variants</title><path d="M 255.0 820 L 255 720 L 940 720 L 940.0 690" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="462.6" y="705.0" width="274.79999999999995" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="600" y="723" class="edge-label" text-anchor="middle" textLength="256.8" lengthAdjust="spacingAndGlyphs">renders fields and panel variants</text></g><g data-relationship-id="r-input-parameters"><title>drag template variable</title><path d="M 305.0 350 L 305 320 L 940 320 L 940.0 350" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="524.4" y="305.0" width="191.2" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="620" y="323" class="edge-label" text-anchor="middle" textLength="173.2" lengthAdjust="spacingAndGlyphs">drag template variable</text></g><g data-relationship-id="r-parameters-draft"><title>onParameterChange updates local draft</title><path d="M 940.0 690 L 940 750 L 690 750 L 690.0 820" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="662.4" y="735.0" width="305.2" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="815" y="753" class="edge-label" text-anchor="middle" textLength="287.2" lengthAdjust="spacingAndGlyphs">onParameterChange updates local draft</text></g><g data-relationship-id="r-save-draft"><title>handleSave commits draft</title><path d="M 810.0 285 L 810 310 L 460 310 L 460 760 L 690 760 L 690.0 820" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><path d="M 575.0 760.0 L 575 975.0" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/><rect x="471.8" y="960.0" width="206.39999999999998" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="575" y="978.0" class="edge-label" text-anchor="middle" textLength="188.4" lengthAdjust="spacingAndGlyphs">handleSave commits draft</text></g><g data-relationship-id="r-run-execution"><title>save if dirty, then execute node</title><path d="M 1070.0 285 L 1070 310 L 1120 760 L 1120.0 820" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="986.4" y="745.0" width="267.2" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1120" y="763" class="edge-label" text-anchor="middle" textLength="249.2" lengthAdjust="spacingAndGlyphs">save if dirty, then execute node</text></g><g data-relationship-id="r-execution-output"><title>appends correlated ExecutionResult</title><path d="M 1120.0 820 L 1120 735 L 1595 735 L 1595.0 690" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1370.0 735.0 L 1460 735" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/><rect x="1318.8" y="720.0" width="282.4" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1460" y="738" class="edge-label" text-anchor="middle" textLength="264.4" lengthAdjust="spacingAndGlyphs">appends correlated ExecutionResult</text></g><g data-relationship-id="r-websocket-output"><title>broadcasts node status and output · via execution_id</title><path d="M 1600.0 820 L 1600 780 L 1760 780 L 1760 720 L 1595 720 L 1595.0 690" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1705.0 720.0 L 1705 774" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/><rect x="1567.6" y="750.0" width="274.79999999999995" height="48" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1705" y="771" class="edge-label" text-anchor="middle" textLength="256.8" lengthAdjust="spacingAndGlyphs">broadcasts node status and output</text><text x="1705" y="791" class="edge-protocol" text-anchor="middle">via execution_id</text></g><g data-relationship-id="r-cancel-websocket"><title>cancel wait or close draft</title><path d="M 1355.0 285 L 1355 310 L 1850 310 L 1850 760 L 1600 760 L 1600.0 820" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1720.0 760.0 L 1720 975.0" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/><rect x="1609.2" y="960.0" width="221.6" height="30" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1720" y="978.0" class="edge-label" text-anchor="middle" textLength="203.6" lengthAdjust="spacingAndGlyphs">cancel wait or close draft</text></g><g data-relationship-id="r-draft-database"><title>save_node_parameters · via TanStack Query + WS</title><path d="M 690.0 945 L 690 970 L 1600 970 L 1600.0 945" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/><rect x="1045.6" y="942.0" width="198.79999999999998" height="48" rx="7" fill="#ffffff" stroke="#d1d5db"/><text x="1145" y="963.0" class="edge-label" text-anchor="middle">save_node_parameters</text><text x="1145" y="983.0" class="edge-protocol" text-anchor="middle" textLength="180.8" lengthAdjust="spacingAndGlyphs">via TanStack Query + WS</text></g><g data-component-id="node-identity"><title>Node identity</title><rect x="90" y="175" width="560" height="110" rx="12" fill="#ffffff" stroke="#8be9fd" stroke-width="2"/><rect x="90" y="175" width="560" height="7" rx="4" fill="#8be9fd"/><text x="108" y="201" class="type-label">MODAL HEADER</text><text x="108" y="227" class="node-label">Node identity</text><text x="108" y="253" class="node-detail">Icon · display name · dirty marker</text></g><g data-component-id="save-action"><title>Save</title><rect x="700" y="175" width="220" height="110" rx="12" fill="#ffffff" stroke="#ff79c6" stroke-width="2"/><rect x="700" y="175" width="220" height="7" rx="4" fill="#ff79c6"/><text x="718" y="201" class="type-label">HEADER ACTION</text><text x="718" y="227" class="node-label">Save</text><text x="718" y="253" class="node-detail" textLength="184.0" lengthAdjust="spacingAndGlyphs">Disabled when clean or canvas locked</text></g><g data-component-id="run-action"><title>Run</title><rect x="960" y="175" width="220" height="110" rx="12" fill="#ffffff" stroke="#ff79c6" stroke-width="2"/><rect x="960" y="175" width="220" height="7" rx="4" fill="#ff79c6"/><text x="978" y="201" class="type-label">HEADER ACTION</text><text x="978" y="227" class="node-label">Run</text><text x="978" y="253" class="node-detail" textLength="184.0" lengthAdjust="spacingAndGlyphs">Hidden by uiHints when passive</text></g><g data-component-id="cancel-action"><title>Cancel / Stop</title><rect x="1220" y="175" width="270" height="110" rx="12" fill="#ffffff" stroke="#ff79c6" stroke-width="2"/><rect x="1220" y="175" width="270" height="7" rx="4" fill="#ff79c6"/><text x="1238" y="201" class="type-label">HEADER ACTION</text><text x="1238" y="227" class="node-label">Cancel / Stop</text><text x="1238" y="253" class="node-detail" textLength="234.0" lengthAdjust="spacingAndGlyphs">Revert draft or cancel active wait</text></g><g data-component-id="close-action"><title>Close (X)</title><rect x="1530" y="175" width="300" height="110" rx="12" fill="#ffffff" stroke="#9aa1ac" stroke-width="2"/><rect x="1530" y="175" width="300" height="7" rx="4" fill="#9aa1ac"/><text x="1548" y="201" class="type-label">MODAL ACTION</text><text x="1548" y="227" class="node-label">Close (X)</text><text x="1548" y="253" class="node-detail">Cancel draft and deselect node</text></g><g data-component-id="input-column"><title>Input Data &amp; Variables</title><rect x="90" y="350" width="430" height="340" rx="12" fill="#ffffff" stroke="#8be9fd" stroke-width="2"/><rect x="90" y="350" width="430" height="7" rx="4" fill="#8be9fd"/><text x="108" y="376" class="type-label">LEFT COLUMN · 0.7</text><text x="108" y="402" class="node-label">Input Data &amp;</text><text x="108" y="424" class="node-label">Variables</text><text x="108" y="450" class="node-detail">Upstream execution values or output schema</text><text x="108" y="470" class="node-detail">Recursive object and array fields</text><text x="108" y="490" class="node-detail">Drag template variables into parameters</text></g><g data-component-id="parameters-column"><title>Parameters</title><rect x="560" y="350" width="760" height="340" rx="12" fill="#ffffff" stroke="#8be9fd" stroke-width="2"/><rect x="560" y="350" width="760" height="7" rx="4" fill="#8be9fd"/><text x="578" y="376" class="type-label">MIDDLE COLUMN · 1.6</text><text x="578" y="402" class="node-label">Parameters</text><text x="578" y="428" class="node-detail">Schema-rendered local edit buffer</text><text x="578" y="448" class="node-detail">Specialized middle panels selected by uiHints</text><text x="578" y="468" class="node-detail">Connected Skills · Token Usage · Console</text></g><g data-component-id="output-column"><title>Output</title><rect x="1360" y="350" width="470" height="340" rx="12" fill="#ffffff" stroke="#50fa7b" stroke-width="2"/><rect x="1360" y="350" width="470" height="7" rx="4" fill="#50fa7b"/><text x="1378" y="376" class="type-label">RIGHT COLUMN · 0.7</text><text x="1378" y="402" class="node-label">Output</text><text x="1378" y="428" class="node-detail">Local run results + WebSocket status</text><text x="1378" y="448" class="node-detail">Deduplicates matching execution_id</text><text x="1378" y="468" class="node-detail">Clear results without changing parameters</text></g><g data-component-id="node-spec"><title>NodeSpec metadata</title><rect x="90" y="820" width="330" height="110" rx="12" fill="#ffffff" stroke="#ff79c6" stroke-width="2"/><rect x="90" y="820" width="330" height="7" rx="4" fill="#ff79c6"/><text x="108" y="846" class="type-label">SCHEMA SOURCE</text><text x="108" y="872" class="node-label">NodeSpec metadata</text><text x="108" y="898" class="node-detail">properties · handles · uiHints</text></g><g data-component-id="parameter-state"><title>Parameter query + draft</title><rect x="500" y="820" width="380" height="125" rx="12" fill="#ffffff" stroke="#ffb86c" stroke-width="2"/><rect x="500" y="820" width="380" height="7" rx="4" fill="#ffb86c"/><text x="518" y="846" class="type-label">CLIENT STATE</text><text x="518" y="872" class="node-label">Parameter query</text><text x="518" y="894" class="node-label">+ draft</text><text x="518" y="920" class="node-detail">defaults + saved params</text><text x="518" y="940" class="node-detail">dirty edit buffer + query cache</text></g><g data-component-id="execution-service"><title>ExecutionService</title><rect x="940" y="820" width="360" height="110" rx="12" fill="#ffffff" stroke="#ffb86c" stroke-width="2"/><rect x="940" y="820" width="360" height="7" rx="4" fill="#ffb86c"/><text x="958" y="846" class="type-label">PER-NODE RUNTIME</text><text x="958" y="872" class="node-label">ExecutionService</text><text x="958" y="898" class="node-detail">save-before-run · executeNode</text><text x="958" y="918" class="node-detail">per-node reducer</text></g><g data-component-id="websocket-database"><title>WebSocket + workflow.db</title><rect x="1370" y="820" width="460" height="125" rx="12" fill="#ffffff" stroke="#ff79c6" stroke-width="2"/><rect x="1370" y="820" width="460" height="7" rx="4" fill="#ff79c6"/><text x="1388" y="846"