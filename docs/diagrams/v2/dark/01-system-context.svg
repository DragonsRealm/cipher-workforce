 MCP / CLI / HTTPS</title><path d="M 1105 487.5 L 1240 487 L 1240 762 L 1480 762.5" fill="none" stroke="#e8eaed" stroke-width="2" marker-end="url(#arrow)"/><rect x="1250.6" y="738.0" width="198.79999999999998" height="48" rx="7" fill="#15171c" stroke="#2b2f37"/><text x="1350" y="759" class="edge-label" text-anchor="middle" textLength="180.8" lengthAdjust="spacingAndGlyphs">Uses code and dev tools</text><text x="1350" y="779" class="edge-protocol" text-anchor="middle" textLength="180.8" lengthAdjust="spacingAndGlyphs">via MCP / CLI / HTTPS</text></g><g data-relationship-id="r-opencompany-search"><title>Indexes and retrieves knowledge · via HTTPS / vector API</title><path d="M 1105 487.5 L 1210 487 L 1210 910 L 1480 910.0" fill="none" stroke="#e8eaed" stroke-width="2" marker-end="url(#arrow)"/><rect x="1210.2" y="886.0" width="259.6" height="48" rx="7" fill="#15171c" stroke="#2b2f37"/><text x="1340" y="907" class="edge-label" text-anchor="middle" textLength="241.6" lengthAdjust="spacingAndGlyphs">Indexes and retrieves knowledge</text><text x="1340" y="927" class="edge-protocol" text-anchor="middle">via HTTPS / vector API</text></g><g data-component-id="workflow-authors"><title>Workflow authors</title><rect x="55" y="265" width="285" height="125" rx="12" fill="#1b1e25" stroke="#f1fa8c" stroke-width="2"/><rect x="55" y="265" width="285" height="7" rx="4" fill="#f1fa8c"/><text x="73" y="291" class="type-label">PERSON</text><text x="73" y="317" class="node-label">Workflow authors</text><text x="73" y="343" class="node-detail">Build and test automations</text></g><g data-component-id="workflow-operators"><title>Workflow operators</title><rect x="55" y="640" width="285" height="125" rx="12" fill="#1b1e25" stroke="#f1fa8c" stroke-width="2"/><rect x="55" y="640" width="285" height="7" rx="4" fill="#f1fa8c"/><text x="73" y="666" class="type-label">PERSON</text><text x="73" y="692" class="node-label">Workflow operators</text><text x="73" y="718" class="node-detail">Deploy and supervise runs</text></g><g data-component-id="opencompany"><title>OpenCompany</title><rect x="665" y="385" width="440" height="205" rx="12" fill="#1b1e25" stroke="#bd93f9" stroke-width="2"/><rect x="665" y="385" width="440" height="7" rx="4" fill="#bd93f9"/><text x="683" y="411" class="type-label">SOFTWARE SYSTEM</text><text x="683" y="437" class="node-label">OpenCompany</text><text x="683" y="463" class="node-detail">Visual workflow workspace</text><text x="683" y="483" class="node-detail">Agents, tools, triggers and durable runs</text></g><g data-component-id="llm-providers"><title>LLM providers</title><rect x="1480" y="130" width="365" height="105" rx="12" fill="#1b1e25" stroke="#8be9fd" stroke-width="2"/><rect x="1480" y="130" width="365" height="7" rx="4" fill="#8be9fd"/><text x="1498" y="156" class="type-label">EXTERNAL SYSTEM</text><text x="1498" y="182" class="node-label">LLM providers</text><text x="1498" y="208" class="node-detail">Hosted and local inference - text + image input</text></g><g data-component-id="productivity-services"><title>Productivity services</title><rect x="1480" y="275" width="365" height="105" rx="12" fill="#1b1e25" stroke="#50fa7b" stroke-width="2"/><rect x="1480" y="275" width="365" height="7" rx="4" fill="#50fa7b"/><text x="1498" y="301" class="type-label">EXTERNAL SYSTEM</text><text x="1498" y="327" class="node-label">Productivity services</text><text x="1498" y="353" class="node-detail">Mail, calendar, docs and CRM</text></g><g data-component-id="messaging-channels"><title>Messaging channels</title><rect x="1480" y="420" width="365" height="105" rx="12" fill="#1b1e25" stroke="#50fa7b" stroke-width="2"/><rect x="1480" y="420" width="365" height="7" rx="4" fill="#50fa7b"/><text x="1498" y="446" class="type-label">EXTERNAL SYSTEM</text><text x="1498" y="472" class="node-label">Messaging channels</text><text x="1498" y="498" class="node-detail">Chat and social platforms</text></g><g data-component-id="connected-devices"><title>Connected devices</title><rect x="1480" y="565" width="365" height="105" rx="12" fill="#1b1e25" stroke="#50fa7b" stroke-width="2"/><rect x="1480" y="565" width="365" height="7" rx="4" fill="#50fa7b"/><text x="1498" y="591" class="type-label">EXTERNAL SYSTEM</text><text x="1498" y="617" class="node-label">Connected devices</text><text x="1498" y="643" class="node-detail">Android and device services</text></g><g data-component-id="developer-services"><title>Developer services</title><rect x="1480" y="710" width="365" height="105" rx="12" fill="#1b1e25" stroke="#8be9fd" stroke-width="2"/><rect x="1480" y="710" width="365" height="7" rx="4" fill="#8be9fd"/><text x="1498" y="736" class="type-label">EXTERNAL SYSTEM</text><text x="1498" y="762" class="node-label">Developer services</text><text x="1498" y="788" class="node-detail">Code, CLI and MCP tools</text></g><g data-component-id="search-vector-stores"><title>Search and vector stores</title><rect x="1480" y="855" width="365" height="110" rx="12" fill="#1b1e25" stroke="#ff79c6" stroke-width="2"/><rect x="1480" y="855" width="365" height="7" rx="4" fill="#ff79c6"/><text x="1498" y="881" class="type-label">EXTERNAL SYSTEM</text><text x="1498" y="907" class="node-label">Search and</text><text x="1498" y="929" class="node-label">vector stores</text><text x="1498" y="955" class="node-detail">Retrieval and knowledge indexes</text></g><g data-callout-id="system-purpose"><rect x="615" y="700" width="540" height="135" rx="10" fill="#1b1e25" stroke="#f1fa8c" stroke-width="2" stroke-dasharray="7 6"/><text x="631" y="730" class="callout-title">System responsibility</text><text x="631" y="756" class="callout-text">Compose external capabilities as directed graphs.</text><text x="631" y="778" class="callout-text">Keep execution, credentials and observability</text><text x="631" y="800" class="callout-text">inside one user-scoped workspace.</text></g>
