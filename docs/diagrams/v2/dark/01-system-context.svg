<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" role="img" aria-labelledby="title desc" data-theme="dark" data-geometry-signature="7b0bff93951dc145">
<title id="title">OpenCompany System Context — dark theme</title>
<desc id="desc">A C4-style system context view of OpenCompany as an automation workspace between human users and external model, productivity, messaging, device, developer, and retrieval services. Sources: README.md; server/nodes/groups.py; server/config/credential_providers.json; server/main.py</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8eaed"/></marker>
  <style>
    .title { fill:#e8eaed; font:700 30px Geist,system-ui,sans-serif; }
    .subtitle { fill:#9aa1ac; font:400 18px Geist,system-ui,sans-serif; }
    .group-label { fill:#9aa1ac; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:1.2px; }
    .type-label { fill:#9aa1ac; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.8px; }
    .node-label { fill:#e8eaed; font:650 20px Geist,system-ui,sans-serif; }
    .node-detail { fill:#9aa1ac; font:400 16px Geist,system-ui,sans-serif; }
    .edge-label { fill:#e8eaed; font:500 16px Geist,system-ui,sans-serif; }
    .edge-protocol { fill:#9aa1ac; font:500 16px 'JetBrains Mono',ui-monospace,monospace; }
    .callout-title { fill:#e8eaed; font:650 18px Geist,system-ui,sans-serif; }
    .callout-text { fill:#9aa1ac; font:400 16px Geist,system-ui,sans-serif; }
    .legend { fill:#9aa1ac; font:500 16px Geist,system-ui,sans-serif; }
  </style>
</defs>
<rect width="1920" height="1080" fill="#0d0f13"/>
<text x="72" y="58" class="title">OpenCompany System Context</text>
<text x="72" y="91" class="subtitle">Who uses the system and which external capabilities it orchestrates</text>
<g data-group-id="opencompany-boundary"><rect x="420" y="145" width="930" height="800" rx="18" fill="#15171c" stroke="#bd93f9" stroke-width="2"/><text x="440" y="177" class="group-label">OPENCOMPANY SYSTEM BOUNDARY</text></g><g data-relationship-id="r-authors-design"><title>Design and run automations · via Browser UI / CLI</title><path d="M 340 327.5 L 510 327 L 510 445 L 665 487.5" fill="none" stroke="#e8eaed" stroke-width="2" marker-end="url(#arrow)"/><rect x="389.2" y="341.0" width="221.6" height="48" rx="7" fill="#15171c" stroke="#2b2f37"/><text x="500" y="362" class="edge-label" text-anchor="middle" textLength="203.6" lengthAdjust="spacingAndGlyphs">Design and run automations</text><text x="500" y="382" class="edge-protocol" text-anchor="middle">via Browser UI / CLI</text></g><g data-relationship-id="r-operators-control"><title>Control deployed workflows · via Browser UI / WebSocket</title><path d="M 340 702.5 L 535 702 L 535 535 L 665 487.5" fill="none" stroke="#e8eaed" stroke-width="2" marker-end="url(#arrow)"/><rect x="394.2" y="641.0" width="221.6" height="48" rx="7" fill="#15171c" stroke="#2b2f37"/><text x="505" y="662" class="edge-label" text-anchor="middle" textLength="203.6" lengthAdjust="spacingAndGlyphs">Control deployed workflows</text><text x="505" y="682" class="edge-protocol" text-anchor="middle" textLength="203.6" lengthAdjust="spacingAndGlyphs">via Browser UI / WebSocket</text></g><g data-relationship-id="r-opencompany-llm"><title>Requests inference · via Provider SDK / HTTPS</title><path d="M 1105 487.5 L 1210 487 L 1210 182 L 1480 182.5" fill="none" stroke="#e8eaed" stroke-width="2" marker-end="url(#arrow)"/><rect x="1221.8" y="158.0" width="206.39999999999998" height="48" rx="7" fill="#15171c" stroke="#2b2f37"/><text x="1325" y="179" class="edge-label" text-anchor="middle">Requests inference</text><text x="1325" y="199" class="edge-protocol" text-anchor="middle" textLength="188.4" lengthAdjust="spacingAndGlyphs">via Provider SDK / HTTPS</text