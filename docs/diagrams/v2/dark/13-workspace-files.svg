<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" role="img" aria-labelledby="title desc" data-theme="dark" data-geometry-signature="c97fa2af80f57078">
<title id="title">Workspace Files — dark theme</title>
<desc id="desc">Source-backed anatomy of the Gallery node’s Workspace Files panel, separating WebSocket listing/search from HTTP content and upload routes while showing how controlled path and selection parameters drive the Gallery node’s FileRef output. Sources: client/src/components/parameterPanel/GalleryPanel.tsx; client/src/components/parameterPanel/gallery/WorkspaceBrowser.tsx; server/nodes/filesystem/gallery/_handlers.py; server/nodes/filesystem/gallery/_service.py; server/nodes/filesystem/gallery/__init__.py; server/nodes/filesystem/_backend.py; server/routers/workspace.py; docs-internal/node-logic-flows/code_fs_process/gallery.md</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8eaed"/></marker>
  <style>
    .title { fill:#e8eaed; font:700 30px Geist,system-ui,sans-serif; }
    .subtitle { fill:#9aa1ac; font:400 18px Geist,system-ui,sans-serif; }
    .group-label { fill:#9aa1ac; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:1.2px; }
    .type-label { fill:#9aa1ac; font:600 16px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.8px; }
    .node-label { fill:#e8eaed; font:650 20px Geist,system-ui,sans-serif; }
    .node-detail { fill:#9aa1ac; font:400 16px Geist,system-ui,sans-serif; }
    .edge-label { fill:#e8eaed; font:500 16px Geist,system-ui,sans-serif; }
    .edge-protocol { fill:#9aa1ac; font:500 16px 'JetBrains Mono',ui-monospace,monospace; }
    .callout-title { fill:#e8eaed; font:650 18px Geist,system-ui,sans-serif; }
    .callout-text { fill:#9aa1ac; font:400 16px Geist,system-ui,sans-serif; }
    .legend { fill:#9aa1ac; font:500 16px Geist,system-ui,sans-serif; }
  </style>
</defs>
<rect width="1920" height="1080" fill="#0d0f13"/>
<text x="72" y="58" class="title">Workspace Files</text>
<text x="72" y="91" class="subtitle">Browse, search, upload, preview, pin, and emit files from the workflow’s contained workspace.</text>
