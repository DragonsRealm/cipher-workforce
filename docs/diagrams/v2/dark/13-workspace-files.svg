8" y="226" class="type-label">WEBSOCKET</text><text x="1068" y="252" class="node-label">list_workspace_files</text><text x="1068" y="278" class="node-detail">path or workspace-wide search</text><text x="1068" y="298" class="node-detail">limit 500 from panel</text></g><g data-component-id="workspace-http-routes"><title>Workspace HTTP routes</title><rect x="1450" y="200" width="360" height="130" rx="12" fill="#1b1e25" stroke="#8be9fd" stroke-width="2"/><rect x="1450" y="200" width="360" height="7" rx="4" fill="#8be9fd"/><text x="1468" y="226" class="type-label">HTTP</text><text x="1468" y="252" class="node-label">Workspace HTTP routes</text><text x="1468" y="278" class="node-detail">POST uploads</text><text x="1468" y="298" class="node-detail">GET content · Range</text></g><g data-component-id="workspace-listing-service"><title>Workspace listing service</title><rect x="1050" y="390" width="340" height="130" rx="12" fill="#1b1e25" stroke="#bd93f9" stroke-width="2"/><rect x="1050" y="390" width="340" height="7" rx="4" fill="#bd93f9"/><text x="1068" y="416" class="type-label">SERVICE</text><text x="1068" y="442" class="node-label">Workspace listing</text><text x="1068" y="464" class="node-label">service</text><text x="1068" y="490" class="node-detail">directory or recursive glob</text><text x="1068" y="510" class="node-detail">sort, cap, crumbs, preview</text></g><g data-component-id="contained-workspace-root"><title>Contained workflow workspace</title><rect x="1450" y="390" width="360" height="130" rx="12" fill="#1b1e25" stroke="#ff79c6" stroke-width="2"/><rect x="1450" y="390" width="360" height="7" rx="4" fill="#ff79c6"/><text x="1468" y="416" class="type-label">FILESYSTEM</text><text x="1468" y="442" class="node-label">Contained workflow</text><text x="1468" y="464" class="node-label">workspace</text><text x="1468" y="490" class="node-detail">WorkspaceBackend</text><text x="1468" y="510" class="node-detail">workspace-relative paths</text></g><g data-component-id="gallery-node-runtime"><title>Gallery node execution</title><rect x="1050" y="650" width="340" height="120" rx="12" fill="#1b1e25" stroke="#ffb86c" stroke-width="2"/><rect x="1050" y="650" width="340" height="7" rx="4" fill="#ffb86c"/><text x="1068" y="676" class="type-label">RUNTIME</text><text x="1068" y="702" class="node-label">Gallery node</text><text x="1068" y="724" class="node-label">execution</text><text x="1068" y="750" class="node-detail">selection &gt; pattern &gt; directory</text></g><g data-component-id="gallery-file-ref-output"><title>Downstream FileRef output</title><rect x="1450" y="650" width="360" height="120" rx="12" fill="#1b1e25" stroke="#50fa7b" stroke-width="2"/><rect x="1450" y="650" width="360" height="7" rx="4" fill="#50fa7b"/><text x="1468" y="676" class="type-label">RESULT</text><text x="1468" y="702" class="node-label">Downstream FileRef</text><text x="1468" y="724" class="node-label">output</text><text x="1468" y="750" class="node-detail">files · directories · missing[]</text></g><g data-callout-id="workspace-channel-contract"><rect x="70" y="880" width="1780" height="90" rx="10" fill="#1b1e25" stroke="#f1fa8c" stroke-width="2" stroke-dasharray="7 6"/><text x="86" y="910" class="callout-title">Two channels, one contained workspace</text><text x="86" y="936" class="callout-text">WebSocket owns listing and search; HTTP owns upload and file bytes for preview, download, and Range requests.</text><text x="86" y="958" class="callout-text">Rows arrive with a server-built FileRef and preview verdict, so the client does not duplicate path or security decisions.</text></g>
